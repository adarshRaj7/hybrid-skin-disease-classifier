data:
  dataset_dir: "data/SkinDisease"
  train_subdir: "SkinDisease/train"
  test_subdir: "SkinDisease/test"
  image_size: 224
  batch_size: 32
  num_workers: 2
  val_fraction: 0.15
  split_seed: 42

augmentation:
  horizontal_flip_p: 0.5
  vertical_flip_p: 0.3
  rotation_degrees: 30.0
  color_jitter_brightness: 0.2
  color_jitter_contrast: 0.2
  color_jitter_saturation: 0.2
  color_jitter_hue: 0.02
  affine_translate: 0.1

model:
  num_classes: 22
  dropout_rate: 0.5
  freeze_backbones: false
  pretrained_backbones: true
  model_version: "1.0.0"

train:
  epochs: 30
  backbone_lr: 0.00001
  classifier_lr: 0.0001
  weight_decay: 0.01
  use_class_weights: false
  label_smoothing: 0.0
  scheduler_patience: 3
  scheduler_factor: 0.5
  early_stopping_patience: 8
  checkpoint_metric: "val_macro_recall"
  mixed_precision: true
  seed: 42
  grad_clip_norm: 5.0

paths:
  models_dir: "models"
  outputs_dir: "outputs"
  class_names_file: "models/class_names.json"
