[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skin-disease-classifier"
version = "1.0.0"
description = "Hybrid ResNet50 + DenseNet121 skin disease classifier (research/decision-support, not a medical device)."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "api"]
